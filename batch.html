<script>
(function(){
  try{
    // Smart Account routing: guest -> auth page, logged-in -> dashboard
    var hasTok=function(){ try{return !!(localStorage.getItem('sm_user_token')||sessionStorage.getItem('sm_user_token'));}catch(x){return false;} };
    if(!hasTok()) document.querySelectorAll('[data-account-link]').forEach(function(a){ a.href='auth.html?next='+encodeURIComponent('dashboard.html'); });
  }catch(e){}
  // click-time re-check (token may change without reload)
  document.addEventListener('click',function(e){
    var a=e.target&&e.target.closest?e.target.closest('[data-account-link]'):null;
    if(!a) return;
    var t=''; try{t=localStorage.getItem('sm_user_token')||sessionStorage.getItem('sm_user_token')||'';}catch(x){}
    if(!t){ e.preventDefault(); location.href='auth.html?next='+encodeURIComponent('dashboard.html'); }
  });
})();
</script>

<script>
const batchParam = (new URLSearchParams(window.location.search).get('batch') || '').trim();
let batchInfo = null;
let allCourses = [];
let tabList = [];
let selectedCategory = '';
let platformFilter = 'All';
let sortBy = 'latest';

const TAB_ICONS = {
  academic: 'fa-book-open',
  admission: 'fa-building-columns',
  revision: 'fa-bullseye',
  skill: 'fa-laptop-code',
  ebook: 'fa-book'
};
const TAB_ORDER = ['academic', 'admission', 'revision'];

function esc(s){
  return String(s == null ? '' : s).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}

function selectCategory(slug){
  selectedCategory = slug;
  document.querySelectorAll('#categoryTabs [data-tab]').forEach(b => {
    const on = b.dataset.tab === slug;
    b.className = (on ? 'tab-active' : 'tab-inactive') + ' flex items-center justify-center gap-1.5 py-2.5 rounded-[10px] font-bold text-[12px] sm:text-[13px]' + (on ? ' shadow-sm' : '');
  });
  render();
}

function setPlatformFilter(val){
  platformFilter = val;
  document.querySelectorAll('#platformFilters [data-filter="platform"]').forEach(b => {
    b.classList.toggle('active', b.dataset.value === val);
  });
  render();
}

function sortCourses(){
  const sel = document.getElementById('sortSelect');
  sortBy = sel.value;
  document.getElementById('sortLabel').textContent = sel.options[sel.selectedIndex].text;
  render();
}

function getFiltered(){
  let list = allCourses.filter(c => {
    if (selectedCategory && String(c.categorySlug || '').toLowerCase() !== String(selectedCategory).toLowerCase()) return false;
    if (platformFilter !== 'All' && String(c.platformName || '') !== platformFilter) return false;
    return true;
  });
  if (sortBy === 'priceLow') list = list.slice().sort((a, b) => Number(a.price) - Number(b.price));
  else if (sortBy === 'priceHigh') list = list.slice().sort((a, b) => Number(b.price) - Number(a.price));
  else list = list.slice().sort((a, b) => Number(b.id) - Number(a.id));
  return list;
}

function render(){
  const list = getFiltered();
  document.getElementById('courseCount').textContent = list.length;
  const container = document.getElementById('courseList');
  const noRes = document.getElementById('noResult');
  if (list.length === 0) {
    container.innerHTML = '';
    noRes.classList.remove('hidden');
    return;
  }
  noRes.classList.add('hidden');
  container.innerHTML = list.map(c => {
    const color = c.batchColor || (batchInfo && batchInfo.color) || '#4F46E5';
    const grad = 'linear-gradient(135deg, ' + color + ' 0%, #0F2043 100%)';
    const catSlug = String(c.categorySlug || '').toLowerCase();
    const icon = TAB_ICONS[catSlug] || 'fa-book-open';
    const classes = c.totalClass ? c.totalClass + ' Classes' : (c.duration || 'Full Course');
    const oldP = c.oldPrice && Number(c.oldPrice) > Number(c.price)
      ? '<span class="text-[11px] text-slate-400 line-through ml-1">৳' + esc(c.oldPrice) + '</span>' : '';
    const leftBlock = c.thumbnail
      ? `<img src="${esc(c.thumbnail)}" alt="${esc(c.title)}" class="absolute inset-0 w-full h-full object-cover" loading="lazy">
         <span class="absolute top-2 left-2 px-2 py-0.5 rounded-full bg-black/45 backdrop-blur border border-white/25 text-white text-[8px] font-semibold">${esc(c.batchName || (batchInfo && batchInfo.name) || 'Batch')}</span>`
      : `<div class="absolute inset-0" style="background:${grad}"></div>
         <div class="relative p-3 flex flex-col h-full">
           <span class="w-fit px-2 py-0.5 rounded-full bg-white/15 border border-white/20 text-white text-[8px] font-semibold">${esc(c.batchName || (batchInfo && batchInfo.name) || 'Batch')}</span>
           <h3 class="text-white font-black text-[13px] sm:text-[14px] leading-tight mt-2">${esc((c.categoryName || 'Course').toUpperCase())}</h3>
           <p class="text-white/80 text-[8px] font-semibold mt-1">${esc((c.platformName || '').toUpperCase())}</p>
           <div class="absolute right-1 bottom-1 opacity-15"><i class="fa-solid ${icon} text-white text-[36px]"></i></div>
         </div>`;
    const teacherRow = c.teacher ? `
        <div class="flex items-center gap-1 mt-1.5">
          <span class="w-5 h-5 rounded-full bg-[#EEF2FF] text-[#1A56FF] flex items-center justify-center text-[10px] font-bold flex-shrink-0">${esc(c.teacher.trim().charAt(0).toUpperCase())}</span>
          <span class="text-[11px] font-medium text-slate-600 truncate">${esc(c.teacher)}</span>
        </div>` : '';
    return `
    <div onclick="window.location.href='course.html?id=${c.id}'" class="course-card bg-white rounded-[14px] border border-slate-100 shadow-[0_2px_10px_rgba(0,0,0,0.04)] overflow-hidden flex cursor-pointer">
      <div class="w-[130px] sm:w-[170px] aspect-video self-center flex-shrink-0 relative overflow-hidden bg-[#0F2043] sm:ml-3 sm:rounded-[10px]">
        ${leftBlock}
      </div>
      <div class="flex-1 min-w-0 p-3 flex flex-col">
        <div class="flex items-start justify-between gap-2">
          <div class="flex-1 min-w-0">
            <span class="inline-flex px-2 py-0.5 rounded bg-[#E6F4EA] text-[#16A34A] text-[9px] font-bold">${esc(c.platformName || 'Online')}</span>
            <h3 class="font-bold text-[12px] sm:text-[13px] text-[#0F2043] leading-tight mt-1 line-clamp-2">${esc(c.title)}</h3>
          </div>
        </div>
        ${teacherRow}
        <div class="flex items-center gap-2 mt-2 text-[10px] text-slate-500">
          <span class="flex items-center gap-1 bg-[#F1F5F9] px-2 py-1 rounded-full whitespace-nowrap"><i class="fa-regular fa-clock text-[10px]"></i> ${esc(classes)}</span>
          ${c.discount ? '<span class="flex items-center gap-1 bg-[#E6F4EA] text-[#16A34A] px-2 py-1 rounded-full font-bold whitespace-nowrap">-' + c.discount + '%</span>' : ''}
        </div>
        <div class="mt-auto flex items-center justify-between pt-2 gap-2">
          <span class="text-[#1A56FF] font-extrabold text-[14px] whitespace-nowrap">৳${esc(c.price)}${oldP}</span>
          <span class="flex items-center gap-1.5">
            <a href="course.html?id=${c.id}" onclick="event.stopPropagation()" class="px-3 py-1.5 bg-white border border-[#1A56FF] text-[#1A56FF] rounded-full text-[11px] font-bold">Details</a>
            <button data-sm-add="${c.id}" onclick="event.stopPropagation()" class="px-3 py-1.5 bg-[#1A56FF] hover:bg-[#1446D1] text-white rounded-full text-[11px] font-bold flex items-center gap-1"><i class="fa-solid fa-cart-shopping text-[10px]"></i> Add to Cart</button>
          </span>
        </div>
      </div>
    </div>`;
  }).join('');
}

function resetFilters(){
  platformFilter = 'All';
  const sel = document.getElementById('sortSelect');
  if (sel) sel.value = 'latest';
  sortBy = 'latest';
  const lbl = document.getElementById('sortLabel');
  if (lbl) lbl.textContent = 'Latest';
  if (tabList.length) selectCategory(tabList[0].slug);
  else render();
}

function buildTabs(){
  const seen = {};
  tabList = [];
  allCourses.forEach(c => {
    const slug = String(c.categorySlug || '').toLowerCase();
    if (!slug || seen[slug]) return;
    seen[slug] = true;
    tabList.push({ slug, name: c.categoryName || slug });
  });
  tabList.sort((a, b) => {
    const ia = TAB_ORDER.indexOf(a.slug), ib = TAB_ORDER.indexOf(b.slug);
    if (ia === -1 && ib === -1) return a.name.localeCompare(b.name);
    if (ia === -1) return 1;
    if (ib === -1) return -1;
    return ia - ib;
  });
  const wrap = document.getElementById('categoryTabs');
  if (!tabList.length) {
    wrap.className = 'bg-[#F1F5F9] p-1.5 rounded-[12px] text-center text-[12px] text-slate-400 py-3';
    wrap.innerHTML = 'No categories yet';
    selectedCategory = '';
    return;
  }
  const cols = Math.min(tabList.length, 3);
  wrap.className = 'grid gap-2 bg-[#F1F5F9] p-1.5 rounded-[12px] grid-cols-' + cols;
  wrap.innerHTML = tabList.map(t => `
    <button data-tab="${esc(t.slug)}" onclick="selectCategory('${esc(t.slug)}')" class="tab-inactive flex items-center justify-center gap-1.5 py-2.5 rounded-[10px] font-bold text-[12px] sm:text-[13px]">
      <i class="fa-solid ${TAB_ICONS[t.slug] || 'fa-layer-group'} text-[13px]"></i> ${esc(t.name)}
    </button>`).join('');
  const preferred = tabList.some(t => t.slug === 'academic') ? 'academic' : tabList[0].slug;
  selectCategory(preferred);
}

function buildPlatforms(){
  const wrap = document.getElementById('platformFilters');
  const names = [];
  allCourses.forEach(c => {
    const n = String(c.platformName || '').trim();
    if (n && !names.includes(n)) names.push(n);
  });
  wrap.innerHTML = ['All'].concat(names).map((n, i) =>
    `<button data-filter="platform" data-value="${esc(n)}" onclick="setPlatformFilter('${esc(n)}')" class="filter-pill${i === 0 ? ' active' : ''} px-4 py-1.5 rounded-full text-[12px] font-semibold whitespace-nowrap">${esc(n)}</button>`
  ).join('');
  platformFilter = 'All';
}

function paintBanner(){
  const titleEl = document.getElementById('batchTitle');
  const name = (batchInfo && batchInfo.name) || (batchParam ? batchParam.toUpperCase() : 'Batch');
  titleEl.textContent = name;
  document.title = name + ' - StudyMart';
  const color = (batchInfo && batchInfo.color) || '#4F46E5';
  const banner = document.getElementById('batchBanner');
  if (banner) {
    banner.style.background = color + '14';
    banner.style.borderColor = color + '40';
  }
  document.querySelectorAll('[data-banner-bar]').forEach(el => { el.style.background = color; });
  const icon = document.getElementById('batchBannerIcon');
  if (icon) icon.style.color = color;
}

async function init(){
  const listEl = document.getElementById('courseList');
  try {
    // 1) batch info (match by slug OR id)
    try {
      const rb = await fetch('/api/public/batches');
      if (rb.ok) {
        const jb = await rb.json();
        batchInfo = (jb.data || []).find(b =>
          String(b.slug || '').toLowerCase() === String(batchParam).toLowerCase() ||
          String(b.id) === String(batchParam)
        ) || null;
      }
    } catch (e) { /* offline -> fallback below */ }
    paintBanner();
    // 2) courses of this batch (batchId works even when slug is empty)
    let url = '/api/public/courses?limit=200';
    if (batchInfo) url = '/api/public/courses?batchId=' + encodeURIComponent(batchInfo.id) + '&limit=200';
    else if (batchParam) url = '/api/public/courses?batch=' + encodeURIComponent(batchParam) + '&limit=200';
    const rc = await fetch(url);
    if (!rc.ok) throw new Error('HTTP ' + rc.status);
    const jc = await rc.json();
    allCourses = jc.data || [];
    loadBatchEbooks();
    if (!allCourses.length) {
      document.getElementById('courseCount').textContent = '0';
      document.getElementById('categoryTabs').innerHTML = '<div class="col-span-3 text-center text-[12px] text-slate-400 py-2">No courses in this batch yet</div>';
      listEl.innerHTML = '';
      document.getElementById('noResult').classList.remove('hidden');
      document.querySelector('#noResult p').textContent = 'No courses found in this batch yet';
      return;
    }
    buildPlatforms();
    buildTabs(); // calls render() via selectCategory
  } catch (e) {
    document.getElementById('courseCount').textContent = '0';
    listEl.innerHTML = '';
    document.getElementById('noResult').classList.remove('hidden');
    document.querySelector('#noResult p').textContent = 'Could not load courses. Please check your connection and retry.';
  }
}

async function loadBatchEbooks(){
  const sec = document.getElementById('secBatchEbooks');
  const box = document.getElementById('ebookList');
  if (!sec || !box) return;
  try {
    let url = '/api/public/ebooks?limit=50';
    if (batchInfo) url = '/api/public/ebooks?batchId=' + encodeURIComponent(batchInfo.id) + '&limit=50';
    else if (batchParam) url = '/api/public/ebooks?batch=' + encodeURIComponent(batchParam) + '&limit=50';
    const r = await fetch(url);
    if (!r.ok) return;
    const j = await r.json();
    const list = j.data || [];
    if (!list.length) return;
    document.getElementById('ebookCount').textContent = list.length + ' Books Found';
    box.innerHTML = list.map(b => {
      const price = Number(b.price) || 0, old = Number(b.oldPrice) || 0;
      const off = old > price && price > 0 ? Math.round(((old - price) / old) * 100) : 0;
      const cover = b.cover
        ? `<img src="${esc(b.cover)}" alt="${esc(b.title)}" class="absolute inset-0 w-full h-full object-cover" loading="lazy">`
        : `<div class="absolute inset-0 flex items-center justify-center" style="background:linear-gradient(135deg,${esc(b.batchColor || '#4F46E5')} 0%,#0F2043 100%)"><i class="fa-solid fa-book-open text-white/30 text-[28px]"></i></div>`;
      const priceHtml = price > 0
        ? `<span class="text-[#1A56FF] font-extrabold text-[14px] whitespace-nowrap">৳${price}</span>${old > price ? `<span class="text-[11px] text-slate-400 line-through">৳${old}</span>` : ''}${off ? `<span class="px-1.5 py-0.5 rounded-full bg-[#E6F4EA] text-[#16A34A] text-[9px] font-bold">-${off}%</span>` : ''}`
        : `<span class="text-[#16A34A] font-extrabold text-[13px]">FREE</span>`;
      return `
      <div onclick="window.location.href='ebook.html?id=${b.id}'" class="course-card bg-white rounded-[14px] border border-slate-100 shadow-[0_2px_10px_rgba(0,0,0,0.04)] overflow-hidden flex cursor-pointer">
        <div class="w-[110px] sm:w-[128px] flex-shrink-0 relative overflow-hidden bg-[#F1F5F9]">
          ${cover}
          <span class="absolute top-2 left-2 px-2 py-0.5 rounded-full bg-black/45 backdrop-blur border border-white/25 text-white text-[8px] font-semibold">E-Book</span>
        </div>
        <div class="flex-1 min-w-0 p-3 flex flex-col">
          <h3 class="font-bold text-[12px] sm:text-[13px] text-[#0F2043] leading-tight line-clamp-2">${esc(b.title)}</h3>
          <p class="text-[11px] text-slate-500 mt-1 truncate">${esc(b.author ? 'By ' + b.author : (b.categoryName || ''))}</p>
          <div class="mt-auto flex items-center justify-between pt-2 gap-2">
            <div class="flex items-center gap-1.5 flex-wrap">${priceHtml}</div>
            <span class="px-3 py-1.5 bg-white border border-[#1A56FF] text-[#1A56FF] rounded-full text-[11px] font-bold whitespace-nowrap">View <i class="fa-solid fa-arrow-right text-[9px] ml-0.5"></i></span>
          </div>
        </div>
      </div>`;
    }).join('');
    sec.classList.remove('hidden');
  } catch (e) {}
}

// sort label click toggles the select
document.getElementById('sortLabel').parentElement.addEventListener('click', () => {
  const sel = document.getElementById('sortSelect');
  sel.classList.toggle('hidden');
  sel.focus();
});
document.getElementById('sortSelect').addEventListener('change', () => {
  sortBy = document.getElementById('sortSelect').value;
  document.getElementById('sortLabel').textContent = document.getElementById('sortSelect').options[document.getElementById('sortSelect').selectedIndex].text;
  document.getElementById('sortSelect').classList.add('hidden');
  render();
});

init();
</script>
