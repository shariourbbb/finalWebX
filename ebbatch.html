<script>
var ebBatchParam = '';
var ebCatParam = '';
try {
  var __qs = new URLSearchParams(window.location.search);
  ebBatchParam = (__qs.get('ebookBatch') || __qs.get('batch') || '').trim();
  ebCatParam = (__qs.get('category') || '').trim().toLowerCase();
} catch (e) {}
let ebBatchInfo = null;
let allEbooks = [];
let tabList = [];
let selectedCategory = '';
let authorFilter = 'All';
let sortBy = 'latest';

const TAB_ICONS = {
  academic: 'fa-book-open',
  admission: 'fa-building-columns',
  revision: 'fa-bullseye',
  skill: 'fa-laptop-code',
  ebook: 'fa-book'
};
const TAB_ORDER = ['academic', 'admission', 'revision'];

// Admin -> Home Page -> Category Tabs (batch-wise position order + columns). Bootstrap theke sync, fallback fetch.
function getCtabCfg(){
  try{
    var hp = (window.__SM_BOOTSTRAP__ && window.__SM_BOOTSTRAP__.homePage) || window.__SM_HP__ || null;
    var ct = hp && hp.sections ? hp.sections.categoryTabs : null;
    if(ct){
      var ord = Array.isArray(ct.tabOrder) && ct.tabOrder.length
        ? ct.tabOrder.map(function(s){ return String(s).toLowerCase(); })
        : TAB_ORDER.slice();
      var cols = Math.min(6, Math.max(1, parseInt(ct.cols, 10) || 3));
      // oi batch er nijer position setting thakle setai age
      try{
        var per = ct.perBatch || {};
        var bi = (typeof ebBatchInfo !== 'undefined' && ebBatchInfo) ? ebBatchInfo : null;
        var bid = bi ? String(bi.id || '') : '';
        var bslug = bi ? String(bi.slug || '').toLowerCase() : '';
        var custom = (bid && per['eb:' + bid]) || (bslug && per['eb:' + bslug]) || (bid && per[bid]) || null;
        if(Array.isArray(custom) && custom.length) ord = custom.map(function(s){ return String(s).toLowerCase(); });
      }catch(e){}
      return { order: ord, cols: cols };
    }
  }catch(e){}
  return { order: TAB_ORDER.slice(), cols: 3 };
}
async function refreshCtabCfg(){
  try{
    var r = await fetch('/api/public/homepage');
    var j = await r.json();
    if(j && j.success && j.data){
      window.__SM_HP__ = j.data;
      var cfg = getCtabCfg();
      var key = cfg.order.join('|') + ':' + cfg.cols;
      if(key !== window.__ctabKey){ buildTabs(); }
    }
  }catch(e){}
}

function esc(s){
  return String(s == null ? '' : s).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}

function selectCategory(slug){
  selectedCategory = slug;
  try {
    var __qs = new URLSearchParams(window.location.search);
    __qs.set('category', slug);
    if (ebBatchParam) __qs.set('ebookBatch', ebBatchParam);
    history.replaceState(null, '', window.location.pathname + '?' + __qs.toString());
    ebCatParam = String(slug || '').toLowerCase();
  } catch (e) {}
  document.querySelectorAll('#categoryTabs [data-tab]').forEach(b => {
    const on = b.dataset.tab === slug;
    b.className = (on ? 'tab-active' : 'tab-inactive') + ' flex items-center justify-center gap-1.5 py-2.5 rounded-[10px] font-bold text-[12px] sm:text-[13px]' + (on ? ' shadow-sm' : '');
  });
  render();
}

function setAuthorFilter(val){
  authorFilter = val;
  document.querySelectorAll('#authorFilters [data-filter="author"]').forEach(b => {
    b.classList.toggle('active', b.dataset.value === val);
  });
  render();
}

function sortEbooks(){
  const sel = document.getElementById('sortSelect');
  sortBy = sel.value;
  document.getElementById('sortLabel').textContent = sel.options[sel.selectedIndex].text;
  render();
}

function getFiltered(){
  let list = allEbooks.filter(b => {
    if (selectedCategory && String(b.categorySlug || '').toLowerCase() !== String(selectedCategory).toLowerCase()
        && String(b.categoryName || '').toLowerCase() !== String(selectedCategory).toLowerCase()) return false;
    if (authorFilter !== 'All' && String(b.author || '') !== authorFilter) return false;
    return true;
  });
  if (sortBy === 'priceLow') list = list.slice().sort((a, b) => Number(a.price) - Number(b.price));
  else if (sortBy === 'priceHigh') list = list.slice().sort((a, b) => Number(b.price) - Number(a.price));
  else list = list.slice().sort((a, b) => Number(b.id) - Number(a.id));
  return list;
}

function render(){
  const list = getFiltered();
  document.getElementById('ebookCount').textContent = list.length;
  const container = document.getElementById('ebookList');
  const noRes = document.getElementById('noResult');
  if (list.length === 0) {
    container.innerHTML = '';
    noRes.classList.remove('hidden');
    return;
  }
  noRes.classList.add('hidden');
  container.innerHTML = list.map(b => {
    const color = b.ebookBatchColor || b.batchColor || (ebBatchInfo && ebBatchInfo.color) || '#0EA5E9';
    const cover = b.cover
      ? '<img src="'+esc(b.cover)+'" alt="'+esc(b.title)+'" class="w-full h-full object-cover" loading="lazy">'
      : '<div class="w-full h-full flex items-center justify-center" style="background:linear-gradient(135deg,'+esc(color)+' 0%,#0F2043 100%)"><i class="fa-solid fa-book-open text-white/30 text-[30px]"></i></div>';
    const price = Number(b.price) || 0, old = Number(b.oldPrice) || 0;
    const off = old > price && price > 0 ? Math.round(((old - price) / old) * 100) : 0;
    const priceHtml = price > 0
      ? '<span class="text-[#1A56FF] font-extrabold text-[13px] sm:text-[15px]">৳'+price+'</span>'
        + (old > price ? '<span class="text-[10px] sm:text-[11px] text-slate-400 line-through font-semibold">৳'+old+'</span>' : '')
        + (off ? '<span class="px-1.5 py-0.5 rounded-full bg-[#E6F4EA] text-[#16A34A] text-[9px] font-bold">-'+off+'%</span>' : '')
      : '<span class="text-[#16A34A] font-extrabold text-[13px] sm:text-[14px]">FREE</span>';
    return ''
    + '<div onclick="window.location.href=\'ebook.html?id='+b.id+'\'" class="bg-white rounded-[12px] sm:rounded-[14px] overflow-hidden border border-slate-100 shadow-[0_2px_10px_rgba(0,0,0,0.04)] hover:shadow-md transition flex flex-col cursor-pointer">'
    +   '<div class="relative aspect-[4/3] overflow-hidden bg-[#F1F5F9]">'+cover
    +     '<span class="absolute top-1.5 left-1.5 sm:top-2 sm:left-2 px-2 py-0.5 rounded-full bg-black/45 backdrop-blur border border-white/25 text-white text-[9px] sm:text-[10px] font-bold truncate max-w-[calc(100%-16px)]"><i class="fa-solid fa-file-pdf mr-1"></i>PDF</span>'
    +     (off ? '<span class="absolute top-1.5 right-1.5 sm:top-2 sm:right-2 px-1.5 sm:px-2 py-0.5 rounded-full bg-[#16A34A] text-white text-[9px] sm:text-[10px] font-bold shadow">-'+off+'%</span>' : '')
    +   '</div>'
    +   '<div class="p-2.5 sm:p-3 flex flex-col flex-1">'
    +     '<div class="flex items-center gap-1 sm:gap-1.5 mb-1 flex-wrap">'
    +       (b.categoryName ? '<span class="px-1.5 sm:px-2 py-0.5 rounded-full bg-[#E0F2FE] text-[#0284C7] text-[9px] sm:text-[10px] font-bold truncate">'+esc(b.categoryName)+'</span>' : '')
    +     '</div>'
    +     '<h3 class="text-[12px] sm:text-[13px] font-bold text-[#0F2043] leading-snug line-clamp-2 min-h-[32px] sm:min-h-[36px]">'+esc(b.title)+'</h3>'
    +     (b.author ? '<p class="text-[10px] sm:text-[11px] text-slate-500 mt-0.5 truncate">By '+esc(b.author)+'</p>' : '')
    +     '<div class="mt-auto pt-2 flex items-center justify-between gap-1.5">'
    +       '<div class="flex items-center gap-1 flex-wrap min-w-0">'+priceHtml+'</div>'
    +       '<span class="px-2 sm:px-3 py-1.5 rounded-full bg-[#1A56FF] text-white text-[10px] sm:text-[11px] font-bold whitespace-nowrap flex-shrink-0">View <i class="fa-solid fa-arrow-right text-[9px] ml-0.5"></i></span>'
    +     '</div>'
    +   '</div>'
    + '</div>';
  }).join('');
}

function resetFilters(){
  authorFilter = 'All';
  document.querySelectorAll('#authorFilters [data-filter="author"]').forEach(b => b.classList.toggle('active', b.dataset.value === 'All'));
  const sel = document.getElementById('sortSelect');
  if (sel) sel.value = 'latest';
  sortBy = 'latest';
  const lbl = document.getElementById('sortLabel');
  if (lbl) lbl.textContent = 'Latest';
  if (tabList.length) selectCategory(tabList[0].slug);
  else render();
}

function buildTabs(){
  const seen = {};
  tabList = [];
  allEbooks.forEach(b => {
    const slug = String(b.categorySlug || b.categoryName || '').toLowerCase();
    if (!slug || seen[slug]) return;
    seen[slug] = true;
    tabList.push({ slug, name: b.categoryName || slug });
  });
  const cfg = getCtabCfg();
  window.__ctabKey = cfg.order.join('|') + ':' + cfg.cols;
  tabList.sort((a, b) => {
    const ia = cfg.order.indexOf(a.slug), ib = cfg.order.indexOf(b.slug);
    if (ia === -1 && ib === -1) return a.name.localeCompare(b.name);
    if (ia === -1) return 1;
    if (ib === -1) return -1;
    return ia - ib;
  });
  const wrap = document.getElementById('categoryTabs');
  if (!tabList.length) {
    wrap.className = 'bg-[#F1F5F9] p-1.5 rounded-[12px] text-center text-[12px] text-slate-400 py-3';
    wrap.innerHTML = 'No categories yet';
    selectedCategory = '';
    render();
    return;
  }
  const cols = Math.min(tabList.length, cfg.cols);
  wrap.className = 'grid gap-2 bg-[#F1F5F9] p-1.5 rounded-[12px] grid-cols-' + cols;
  wrap.innerHTML = tabList.map(t => ''
    + '<button data-tab="'+esc(t.slug)+'" onclick="selectCategory(\''+esc(t.slug)+'\')" class="tab-inactive flex items-center justify-center gap-1.5 py-2.5 rounded-[10px] font-bold text-[12px] sm:text-[13px]">'
    +   '<i class="fa-solid '+(TAB_ICONS[t.slug] || 'fa-layer-group')+' text-[13px]"></i> '+esc(t.name)
    + '</button>').join('');
  // ?category= thakle oita preselect (slug ba name — jeta mile), nahole admin position er prothom tab
  let preferred = tabList[0].slug;
  if (ebCatParam) {
    const hit = tabList.find(t => String(t.slug).toLowerCase() === ebCatParam || String(t.name).toLowerCase() === ebCatParam);
    if (hit) preferred = hit.slug;
  }
  selectCategory(preferred);
}

function buildAuthors(){
  const wrap = document.getElementById('authorFilters');
  const names = [];
  allEbooks.forEach(b => {
    const n = String(b.author || '').trim();
    if (n && !names.includes(n)) names.push(n);
  });
  wrap.innerHTML = ['All'].concat(names).map((n, i) =>
    '<button data-filter="author" data-value="'+esc(n)+'" onclick="setAuthorFilter(\''+esc(n).replace(/'/g,"\\'")+'\')" class="filter-pill'+(i === 0 ? ' active' : '')+' px-4 py-1.5 rounded-full text-[12px] font-semibold whitespace-nowrap">'+esc(n)+'</button>'
  ).join('');
  authorFilter = 'All';
}

function paintBanner(){
  const titleEl = document.getElementById('ebBatchTitle');
  const name = (ebBatchInfo && ebBatchInfo.name) || (ebBatchParam ? ebBatchParam.toUpperCase() : 'E-Books');
  titleEl.textContent = name;
  document.title = name + ' - StudyMart';
  const color = (ebBatchInfo && ebBatchInfo.color) || '#0EA5E9';
  const banner = document.getElementById('ebBatchBanner');
  if (banner) {
    banner.style.background = color + '14';
    banner.style.borderColor = color + '40';
  }
  document.querySelectorAll('[data-banner-bar]').forEach(el => { el.style.background = color; });
  const icon = document.getElementById('ebBatchBannerIcon');
  if (icon) icon.style.color = color;
}

async function init(){
  const listEl = document.getElementById('ebookList');
  try {
    // instant bootstrap (zero network first paint)
    try {
      var __cc = window.__SM_BOOTSTRAP__ && window.__SM_BOOTSTRAP__.catalog;
      if (__cc && Array.isArray(__cc.ebookBatches)) {
        var __fb = (__cc.ebookBatches || []).find(function(b){
          return String(b.slug || '').toLowerCase() === String(ebBatchParam).toLowerCase() || String(b.id) === String(ebBatchParam);
        }) || null;
        if (__fb) { ebBatchInfo = __fb; paintBanner(); }
        if (__cc.ebooks && __cc.ebooks.length && ebBatchInfo) {
          allEbooks = __cc.ebooks.filter(function(e){ return String(e.ebookBatchId) === String(ebBatchInfo.id); });
          if (allEbooks.length) { buildAuthors(); buildTabs(); }
        }
      }
    } catch (e) {}
    // 1) ebook-batch info (match by slug OR id)
    try {
      const rb = await fetch('/api/public/ebook-batches');
      if (rb.ok) {
        const jb = await rb.json();
        ebBatchInfo = (jb.data || []).find(b =>
          String(b.slug || '').toLowerCase() === String(ebBatchParam).toLowerCase() ||
          String(b.id) === String(ebBatchParam)
        ) || ebBatchInfo;
      }
    } catch (e) {}
    paintBanner();
    // 2) e-books of this batch
    let url = '/api/public/ebooks?limit=200';
    if (ebBatchInfo) url = '/api/public/ebooks?ebookBatchId=' + encodeURIComponent(ebBatchInfo.id) + '&limit=200';
    else if (ebBatchParam) url = '/api/public/ebooks?ebookBatch=' + encodeURIComponent(ebBatchParam) + '&limit=200';
    const rc = await fetch(url);
    if (!rc.ok) throw new Error('HTTP ' + rc.status);
    const jc = await rc.json();
    allEbooks = jc.data || [];
    if (!allEbooks.length) {
      document.getElementById('ebookCount').textContent = '0';
      document.getElementById('categoryTabs').innerHTML = '<div class="col-span-3 text-center text-[12px] text-slate-400 py-2">No e-books in this batch yet</div>';
      listEl.innerHTML = '';
      document.getElementById('noResult').classList.remove('hidden');
      document.querySelector('#noResult p').textContent = 'No e-books found in this batch yet';
      return;
    }
    buildAuthors();
    buildTabs(); // calls render() via selectCategory
    refreshCtabCfg(); // homepage config (no bootstrap/file://) hole re-apply
  } catch (e) {
    document.getElementById('ebookCount').textContent = '0';
    listEl.innerHTML = '';
    document.getElementById('noResult').classList.remove('hidden');
    document.querySelector('#noResult p').textContent = 'Could not load e-books. Please check your connection and retry.';
  }
}

// sort label click toggles the select
document.getElementById('sortLabel').parentElement.addEventListener('click', () => {
  const sel = document.getElementById('sortSelect');
  sel.classList.toggle('hidden');
  sel.focus();
});
document.getElementById('sortSelect').addEventListener('change', () => {
  sortBy = document.getElementById('sortSelect').value;
  document.getElementById('sortLabel').textContent = document.getElementById('sortSelect').options[document.getElementById('sortSelect').selectedIndex].text;
  document.getElementById('sortSelect').classList.add('hidden');
  render();
});

init();
</script>
