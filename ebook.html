<script>
(function(){
  try{
    // Smart Account routing: guest -> auth page, logged-in -> dashboard
    var hasTok=function(){ try{return !!(localStorage.getItem('sm_user_token')||sessionStorage.getItem('sm_user_token'));}catch(x){return false;} };
    if(!hasTok()) document.querySelectorAll('[data-account-link]').forEach(function(a){ a.href='auth.html?next='+encodeURIComponent('dashboard.html'); });
  }catch(e){}
  // click-time re-check (token may change without reload)
  document.addEventListener('click',function(e){
    var a=e.target&&e.target.closest?e.target.closest('[data-account-link]'):null;
    if(!a) return;
    var t=''; try{t=localStorage.getItem('sm_user_token')||sessionStorage.getItem('sm_user_token')||'';}catch(x){}
    if(!t){ e.preventDefault(); location.href='auth.html?next='+encodeURIComponent('dashboard.html'); }
  });
})();
</script>

<script>
function ebEsc(s){
  return String(s == null ? '' : s).replace(/[&<>"']/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[m]));
}
function ebSize(n){
  n = Number(n) || 0;
  if (n >= 1024 * 1024) return (n / (1024 * 1024)).toFixed(1) + 'MB';
  if (n >= 1024) return Math.round(n / 1024) + 'KB';
  return n + 'B';
}
async function initEbookPage(){
  const id = new URLSearchParams(window.location.search).get('id') || '';
  if (!id) { document.getElementById('bannerTitle').textContent = 'No e-book selected'; return; }
  let b;
  try {
    const r = await fetch('/api/public/ebooks/' + encodeURIComponent(id));
    const j = await r.json();
    if (!j.success) throw new Error(j.message || 'E-book not found');
    b = j.data;
  } catch (e) {
    document.getElementById('bannerTitle').textContent = e.message;
    return;
  }
  document.title = b.title + ' - StudyMart';
  document.getElementById('bannerTitle').textContent = b.title;
  document.getElementById('sideTitle').textContent = b.title;
  document.getElementById('bookTitle').textContent = b.title;
  document.getElementById('bookAuthor').textContent = b.author ? 'By ' + b.author : '';
  if (b.cover) {
    document.getElementById('bigCover').innerHTML = `<img src="${ebEsc(b.cover)}" alt="${ebEsc(b.title)}" class="w-full h-full object-contain">`;
  }
  const price = Number(b.price) || 0, old = Number(b.oldPrice) || 0;
  const off = old > price && price > 0 ? Math.round(((old - price) / old) * 100) : 0;
  document.getElementById('priceRow').innerHTML = price > 0
    ? `<span class="text-[16px] font-bold text-[#0F2043]">Price :</span>
       <span class="text-[22px] font-extrabold text-[#16A34A]">৳${price}</span>
       ${old > price ? `<span class="text-[18px] font-extrabold text-[#EF4444] line-through">৳${old}</span>
       <span class="px-2 py-0.5 bg-[#DCFCE7] text-[#15803D] text-[11px] font-bold rounded-full">${off}% OFF</span>` : ''}`
    : `<span class="px-2.5 py-1 rounded-full bg-[#E6F4EA] text-[#16A34A] text-[12px] font-extrabold">FREE DOWNLOAD</span>`;
  const hasFile = !!(b.fileUrl || b.linkUrl);
  const isFree = !(Number(b.price) > 0);
  let purchased = isFree;
  const ebToken = (() => { try { return localStorage.getItem('sm_user_token') || sessionStorage.getItem('sm_user_token') || ''; } catch (e) { return ''; } })();
  if (hasFile && !isFree && ebToken) {
    try {
      const ra = await fetch('/api/my/ebooks/' + b.id + '/access', { headers: { 'Authorization': 'Bearer ' + ebToken } });
      const ja = await ra.json();
      if (ja.success) purchased = !!ja.data.purchased;
    } catch (e) { /* guest mode */ }
  }
  renderEbookActions(b, { hasFile, isFree, purchased, token: ebToken });
  document.getElementById('bookMeta').innerHTML = '';
  document.getElementById('bookMeta').style.display = 'none';
  document.getElementById('fileInfo').innerHTML = '';
  if (b.details) {
    document.getElementById('aboutCard').classList.remove('hidden');
    document.getElementById('bookDetails').textContent = b.details;
  }
}
function ebTokenNow() {
  try { return localStorage.getItem('sm_user_token') || sessionStorage.getItem('sm_user_token') || ''; } catch (e) { return ''; }
}
function ebToast(msg) {
  const t = document.createElement('div');
  t.className = 'fixed bottom-20 lg:bottom-6 left-1/2 -translate-x-1/2 bg-[#0F2043] text-white px-5 py-3 rounded-full text-[13px] font-semibold shadow-xl z-50';
  t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(() => t.remove(), 2200);
}
function guardLogin(e) {
  if (!ebTokenNow()) {
    e.preventDefault();
    e.stopPropagation();
    ebToast('Please login to buy this e-book');
    setTimeout(() => { window.location.href = 'auth.html?next=' + encodeURIComponent('ebook.html?id=' + (new URLSearchParams(location.search).get('id') || '')); }, 800);
  }
}
async function gatedDownload(id) {
  try {
    const r = await fetch('/api/my/ebooks/' + id + '/download', { headers: { 'Authorization': 'Bearer ' + ebTokenNow() } });
    const j = await r.json();
    if (!j.success) throw new Error(j.message);
    window.location.href = j.data.fileUrl;
  } catch (e) { ebToast(e.message); }
}
function renderEbookActions(b, st) {
  const box = document.getElementById('actionBox');
  const mBox = document.getElementById('mActionBox');
  const dlUrl = '/api/public/ebooks/' + b.id + '/download';
  if (!st.hasFile) {
    const na = `<div class="w-full py-3 rounded-[10px] bg-slate-100 text-slate-400 text-[14px] font-bold text-center">File coming soon</div>`;
    box.innerHTML = na; mBox.innerHTML = na;
    return;
  }
  if (st.isFree || st.purchased) {
    // FREE or already bought -> direct / gated download
    const direct = st.isFree
      ? `<a href="${dlUrl}" class="w-full text-white font-bold text-[15px] py-3 rounded-[10px] flex items-center justify-center gap-2 shadow-[0_4px_14px_rgba(26,86,255,0.35)] transition hover:brightness-110" style="background:#1A56FF"><i class="fa-solid fa-download text-[13px]"></i> Download Now</a>`
      : `<button onclick="gatedDownload(${b.id})" class="w-full text-white font-bold text-[15px] py-3 rounded-[10px] flex items-center justify-center gap-2 shadow-[0_4px_14px_rgba(22,163,74,0.35)] transition hover:brightness-110" style="background:#16A34A"><i class="fa-solid fa-download text-[13px]"></i> Download Now</button>`;
    const mDirect = direct.replaceAll('text-[15px]', 'text-[14px]');
    box.innerHTML = direct; mBox.innerHTML = mDirect;
    return;
  }
  // PAID + not bought yet -> Buy Now + Add to Cart (course style)
  box.innerHTML = `
    <button data-sm-buy="${b.id}" data-sm-kind="ebook" class="w-full text-white font-bold text-[15px] py-3 rounded-[10px] flex items-center justify-center gap-2 shadow-[0_4px_14px_rgba(138,54,235,0.4)] transition hover:brightness-110" style="background:#8a36eb">Buy Now <i class="fa-solid fa-arrow-right text-[13px]"></i></button>
    <button data-sm-add="${b.id}" data-sm-kind="ebook" class="mt-2 w-full bg-white border-2 border-[#1A56FF] text-[#1A56FF] hover:bg-[#EEF2FF] font-bold text-[13px] py-2.5 rounded-[10px] flex items-center justify-center gap-2 transition"><i class="fa-solid fa-cart-shopping text-[13px]"></i> Add to Cart</button>`;
  mBox.innerHTML = `
    <button data-sm-buy="${b.id}" data-sm-kind="ebook" class="w-full text-white font-bold text-[14px] py-3 rounded-[10px] flex items-center justify-center gap-2" style="background:#8a36eb">Buy Now <i class="fa-solid fa-arrow-right text-[11px]"></i></button>`;
  ['actionBox', 'mActionBox'].forEach(boxId => {
    const el = document.getElementById(boxId);
    if (el) el.querySelectorAll('[data-sm-buy],[data-sm-add]').forEach(btn => {
      btn.addEventListener('click', guardLogin, true);
    });
  });
}
initEbookPage();
</script>
