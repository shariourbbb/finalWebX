<script>
(function(){
  try{
    var hasTok=function(){ try{return !!(localStorage.getItem('sm_user_token')||sessionStorage.getItem('sm_user_token'));}catch(x){return false;} };
    if(!hasTok()) document.querySelectorAll('[data-account-link]').forEach(function(a){ a.href='auth.html?next='+encodeURIComponent('dashboard.html'); });
  }catch(e){}
  document.addEventListener('click',function(e){
    var a=e.target&&e.target.closest?e.target.closest('[data-account-link]'):null;
    if(!a) return;
    var t=''; try{t=localStorage.getItem('sm_user_token')||sessionStorage.getItem('sm_user_token')||'';}catch(x){}
    if(!t){ e.preventDefault(); location.href='auth.html?next='+encodeURIComponent('dashboard.html'); }
  });
  try{
    var c=0; try{ c=(JSON.parse(localStorage.getItem('sm_cart'))||[]).length; }catch(x){}
    var badge=document.getElementById('cartBadge'); if(badge){ badge.textContent=c; badge.style.display=c?'flex':'none'; }
  }catch(e){}
})();
</script>
<script>
function esc(s){
  return String(s == null ? '' : s).replace(/[&<>"']/g, function(m){ return ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[m]); });
}

var ebParam = '';
try { ebParam = (new URLSearchParams(window.location.search).get('ebookBatch') || '').trim(); } catch (e) {}
var ebSort = '';
try { ebSort = (new URLSearchParams(window.location.search).get('sort') || '').trim().toLowerCase(); } catch (e) {}
var ebBatches = [];
var ebAllBooks = [];
var ebActive = '';

function ebPillHtml(id, name, active){
  return '<button data-ebbatch="' + esc(id) + '" class="filter-pill flex-shrink-0 px-4 py-2 rounded-full text-[12px] font-bold border whitespace-nowrap' + (active ? ' active' : '') + '">' + esc(name) + '</button>';
}

function renderEbPills(){
  var box = document.getElementById('ebPills');
  var html = ebPillHtml('', 'All E-Books', !ebActive);
  html += ebBatches.map(function(b){
    return ebPillHtml(b.id, b.name, String(b.id) === String(ebActive));
  }).join('');
  box.innerHTML = html;
  box.querySelectorAll('[data-ebbatch]').forEach(function(btn){
    btn.addEventListener('click', function(){
      var id = btn.dataset.ebbatch;
      var url = id ? ('ebooks.html?ebookBatch=' + encodeURIComponent(id)) : 'ebooks.html';
      if (String(id || '') !== String(ebActive || '')) window.location.href = url;
    });
  });
}

function renderEbList(){
  var box = document.getElementById('ebList');
  var empty = document.getElementById('ebEmpty');
  var q = '';
  try { q = (document.getElementById('ebSearch').value || '').toLowerCase().trim(); } catch (e) {}
  var list = ebAllBooks.filter(function(b){
    if (ebActive && String(b.ebookBatchId) !== String(ebActive)) return false;
    if (q && ((b.title + ' ' + (b.details || '') + ' ' + (b.author || '')).toLowerCase().indexOf(q) === -1)) return false;
    return true;
  });
  if (ebSort === 'popular') list = list.slice().sort(function(a, b){ return (Number(b.downloads) || 0) - (Number(a.downloads) || 0); });
  document.getElementById('ebCount').textContent = list.length ? (list.length + ' PDF Found') : '';
  if (!list.length) { box.innerHTML = ''; empty.classList.remove('hidden'); return; }
  empty.classList.add('hidden');
  box.innerHTML = list.map(function(b){
    var price = Number(b.price) || 0, old = Number(b.oldPrice) || 0;
    var off = old > price && price > 0 ? Math.round(((old - price) / old) * 100) : 0;
    var cover = b.cover
      ? '<img src="' + esc(b.cover) + '" alt="' + esc(b.title) + '" class="absolute inset-0 w-full h-full object-cover" loading="lazy">'
      : '<div class="absolute inset-0 flex items-center justify-center" style="background:linear-gradient(135deg,' + esc(b.ebookBatchColor || b.batchColor || '#0EA5E9') + ' 0%,#0F2043 100%)"><i class="fa-solid fa-book-open text-white/30 text-[28px]"></i></div>';
    var priceHtml = price > 0
      ? '<span class="text-[#1A56FF] font-extrabold text-[14px] whitespace-nowrap">৳' + price + '</span>' + (old > price ? '<span class="text-[11px] text-slate-400 line-through">৳' + old + '</span>' : '') + (off ? '<span class="px-1.5 py-0.5 rounded-full bg-[#E6F4EA] text-[#16A34A] text-[9px] font-bold">-' + off + '%</span>' : '')
      : '<span class="text-[#16A34A] font-extrabold text-[13px]">FREE</span>';
    var batchPill = (b.ebookBatchName || b.batchName)
      ? '<span class="px-1.5 py-0.5 rounded-full bg-[#E0F2FE] text-[#0284C7] text-[9px] font-bold">' + esc(b.ebookBatchName || b.batchName) + '</span>' : '';
    return '' +
    '<div onclick="window.location.href=\'ebook.html?id=' + b.id + '\'" class="course-card bg-white rounded-[14px] border border-slate-100 shadow-[0_2px_10px_rgba(0,0,0,0.04)] overflow-hidden flex cursor-pointer">' +
      '<div class="w-[110px] sm:w-[128px] flex-shrink-0 relative overflow-hidden bg-[#F1F5F9]">' +
        cover +
        '<span class="absolute top-2 left-2 px-2 py-0.5 rounded-full bg-black/45 backdrop-blur border border-white/25 text-white text-[8px] font-semibold"><i class="fa-solid fa-file-pdf mr-0.5"></i>PDF</span>' +
      '</div>' +
      '<div class="flex-1 min-w-0 p-3 flex flex-col">' +
        '<div class="flex items-center gap-1.5 flex-wrap mb-1">' + batchPill + (b.downloads ? '<span class="text-[10px] text-slate-400 font-semibold"><i class="fa-solid fa-download mr-0.5"></i>' + b.downloads + '</span>' : '') + '</div>' +
        '<h3 class="bangla font-bold text-[12px] sm:text-[13px] text-[#0F2043] leading-tight line-clamp-2">' + esc(b.title) + '</h3>' +
        '<p class="text-[11px] text-slate-500 mt-1 truncate">' + esc(b.author ? 'By ' + b.author : (b.categoryName || '')) + '</p>' +
        '<div class="mt-auto flex items-center justify-between pt-2 gap-2">' +
          '<div class="flex items-center gap-1.5 flex-wrap">' + priceHtml + '</div>' +
          '<span class="px-3 py-1.5 bg-white border border-[#1A56FF] text-[#1A56FF] rounded-full text-[11px] font-bold whitespace-nowrap">View <i class="fa-solid fa-arrow-right text-[9px] ml-0.5"></i></span>' +
        '</div>' +
      '</div>' +
    '</div>';
  }).join('');
}

async function initEbooks(){
  try {
    var bRes = await fetch('/api/public/ebook-batches');
    var bj = await bRes.json();
    ebBatches = bj.data || [];
    // ?ebookBatch= id ba slug — duitai support
    if (ebParam) {
      var found = ebBatches.find(function(b){
        return String(b.id) === String(ebParam) || String(b.slug || '').toLowerCase() === String(ebParam).toLowerCase();
      });
      if (found) {
        ebActive = found.id;
        document.getElementById('ebTitle').textContent = found.name;
        document.getElementById('ebSub').textContent = 'Ei batch-er sob PDF e-book';
      }
    }
    if (ebSort === 'popular' && !ebActive) {
      document.getElementById('ebTitle').textContent = 'Popular E-Books';
      document.getElementById('ebSub').textContent = 'Sobcheye beshi downloaded PDF e-book';
    }
    renderEbPills();
    var url = '/api/public/ebooks?limit=200';
    if (ebActive) url = '/api/public/ebooks?ebookBatchId=' + encodeURIComponent(ebActive) + '&limit=200';
    var r = await fetch(url);
    var j = await r.json();
    ebAllBooks = j.data || [];
    renderEbList();
  } catch (e) {
    document.getElementById('ebList').innerHTML = '<p class="text-[13px] text-red-400 text-center py-10">Failed to load e-books</p>';
  }
}

document.getElementById('ebSearch').addEventListener('input', renderEbList);
initEbooks();
</script>
