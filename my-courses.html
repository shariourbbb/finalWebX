<script>
(function(){
  try{
    var hasTok=function(){ try{return !!(localStorage.getItem('sm_user_token')||sessionStorage.getItem('sm_user_token'));}catch(x){return false;} };
    if(!hasTok()) document.querySelectorAll('[data-account-link]').forEach(function(a){ a.href='auth.html?next='+encodeURIComponent('dashboard.html'); });
  }catch(e){}
  document.addEventListener('click',function(e){
    var a=e.target&&e.target.closest?e.target.closest('[data-account-link]'):null;
    if(!a) return;
    var t=''; try{t=localStorage.getItem('sm_user_token')||sessionStorage.getItem('sm_user_token')||'';}catch(x){}
    if(!t){ e.preventDefault(); location.href='auth.html?next='+encodeURIComponent('dashboard.html'); }
  });
})();
</script>

<script>
(function(){
  'use strict';
  var esc = function(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(m){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]; }); };
  var $ = function(id){ return document.getElementById(id); };
  function token(){ try{ return localStorage.getItem('sm_user_token')||sessionStorage.getItem('sm_user_token')||''; }catch(e){ return ''; } }
  function headers(){ var t=token(); return t ? { 'Authorization':'Bearer '+t } : {}; }
  var GRADS = [
    'linear-gradient(135deg, #1E0E62 0%, #3B2F8A 60%, #1E135E 100%)',
    'linear-gradient(135deg, #0B3D2E 0%, #165A3A 100%)',
    'linear-gradient(135deg, #0B2E7A 0%, #1A4ABF 100%)',
    'linear-gradient(135deg, #4A2000 0%, #8B3D00 100%)',
    'linear-gradient(135deg, #2A0A4A 0%, #6D28D9 100%)'
  ];
  var all = [];

  function thumb(c){
    if(c.thumbnail) return '<div class="aspect-video relative overflow-hidden bg-[#0F2043]"><img src="'+esc(c.thumbnail)+'" alt="'+esc(c.title)+'" class="w-full h-full object-cover" loading="lazy">'
      + '<span class="absolute inset-0 m-auto w-12 h-12 rounded-full bg-black/45 backdrop-blur border border-white/30 flex items-center justify-center"><i class="fa-solid fa-play text-white text-[16px] ml-0.5"></i></span></div>';
    var g = GRADS[String(c.id||'').length % GRADS.length];
    return '<div class="aspect-video relative overflow-hidden flex flex-col justify-center px-4" style="background:'+g+';">'
      + '<span class="w-fit px-2 py-0.5 rounded-full bg-white/15 border border-white/20 text-white text-[9px] font-bold">'+esc(c.batchName||'Course')+'</span>'
      + '<h3 class="text-white font-black text-[17px] leading-tight mt-2 line-clamp-2">'+esc(c.title||'')+'</h3>'
      + '<span class="absolute inset-0 m-auto w-12 h-12 rounded-full bg-black/45 backdrop-blur border border-white/30 flex items-center justify-center"><i class="fa-solid fa-play text-white text-[16px] ml-0.5"></i></span></div>';
  }

  function render(){
    var box = $('mcList'), cnt = $('mcCount');
    var q = '';
    try{ q = ($('mcSearch').value||'').toLowerCase().trim(); }catch(e){}
    var list = all.filter(function(c){
      if(!q) return true;
      return ((c.title||'')+' '+(c.teacher||'')+' '+(c.batchName||'')).toLowerCase().indexOf(q) !== -1;
    });
    if(cnt) cnt.textContent = all.length ? all.length : '';
    if(!token()){
      box.innerHTML = '<div class="col-span-full text-center py-12 px-4"><div class="w-14 h-14 rounded-full bg-[#EEF2FF] flex items-center justify-center mx-auto"><i class="fa-regular fa-user text-[#1A56FF] text-[20px]"></i></div>'
        + '<p class="text-[14px] font-bold text-[#0F2043] mt-4">Login to see your courses</p>'
        + '<a href="auth.html?next='+encodeURIComponent('my-courses.html')+'" class="inline-flex items-center gap-1.5 mt-4 px-5 py-2.5 rounded-[10px] bg-[#1A56FF] text-white font-bold text-[12.5px]">Login <i class="fa-solid fa-arrow-right text-[11px]"></i></a></div>';
      return;
    }
    if(!list.length){
      box.innerHTML = '<div class="col-span-full text-center py-12 px-4"><div class="w-14 h-14 rounded-full bg-[#EEF2FF] flex items-center justify-center mx-auto"><i class="fa-solid fa-book-open text-[#1A56FF] text-[20px]"></i></div>'
        + '<p class="text-[14px] font-bold text-[#0F2043] mt-4">'+(all.length ? 'Kono course mileni' : 'Akono kono course keno nai')+'</p>'
        + '<p class="text-[12px] text-slate-500 mt-1">Pochonder course kine ekhan theke class koro</p>'
        + '<a href="courses.html" class="inline-flex items-center gap-1.5 mt-4 px-5 py-2.5 rounded-[10px] bg-[#1A56FF] text-white font-bold text-[12.5px]">Browse Courses <i class="fa-solid fa-arrow-right text-[11px]"></i></a></div>';
      return;
    }
    box.innerHTML = list.map(function(c){
      var last = '';
      try{ last = localStorage.getItem('sm_last_lesson_'+c.id) || ''; }catch(e){}
      return '<div class="learn-card bg-white rounded-[14px] border border-slate-100 shadow-[0_2px_10px_rgba(0,0,0,0.04)] overflow-hidden flex flex-col cursor-pointer" onclick="window.location.href=\'learn.html?course='+c.id+'\'">'
        + thumb(c)
        + '<div class="p-3.5 flex flex-col flex-1">'
        + '<div class="flex items-center gap-1.5 flex-wrap mb-1.5">'
        + (c.batchName ? '<span class="px-2 py-0.5 rounded-full bg-[#EDE9FF] text-[#4F46E5] text-[10px] font-bold">'+esc(c.batchName)+'</span>' : '')
        + '<span class="px-2 py-0.5 rounded-full bg-[#E6F4EA] text-[#16A34A] text-[10px] font-bold"><i class="fa-solid fa-check mr-0.5 text-[8px]"></i>Enrolled</span></div>'
        + '<h3 class="font-bold text-[13.5px] text-[#0F2043] leading-snug line-clamp-2 min-h-[38px]">'+esc(c.title)+'</h3>'
        + '<p class="text-[11px] text-slate-500 mt-1 truncate">'+esc(c.teacher||c.categoryName||'')+'</p>'
        + '<div class="mt-3 pt-3 border-t border-slate-100 flex items-center gap-2">'
        + '<span class="flex-1 inline-flex items-center justify-center gap-1.5 py-2.5 rounded-[10px] bg-[#1A56FF] hover:bg-[#1445D6] text-white font-bold text-[12.5px]"><i class="fa-solid fa-play text-[10px]"></i> '+(last ? 'Resume Class' : 'Start Learning')+'</span>'
        + '<span onclick="event.stopPropagation();window.location.href=\'course.html?id='+c.id+'\'" title="Course details" class="w-10 h-10 rounded-[10px] border border-slate-200 flex items-center justify-center text-slate-500 hover:text-[#1A56FF] hover:border-[#1A56FF] flex-shrink-0"><i class="fa-solid fa-circle-info text-[14px]"></i></span>'
        + '</div></div></div>';
    }).join('');
  }

  async function boot(){
    if(!token()){ render(); return; }
    try{
      var r = await fetch('/api/public/my/courses',{headers:headers()});
      if(r.status===401||r.status===404){ try{localStorage.removeItem('sm_user_token');sessionStorage.removeItem('sm_user_token');}catch(e){} render(); return; }
      var j = await r.json();
      all = Array.isArray(j.data) ? j.data : [];
    }catch(e){ all = []; }
    render();
  }
  document.getElementById('mcSearch').addEventListener('input', render);
  document.querySelectorAll('[data-dash-logout]').forEach(function(b){ b.addEventListener('click', async function(){
    try{ await fetch('/api/public/auth/logout',{method:'POST',headers:headers()}); }catch(e){}
    try{ localStorage.removeItem('sm_user_token'); sessionStorage.removeItem('sm_user_token'); }catch(e){}
    location.href = 'index.html';
  }); });
  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',boot);
  else boot();
})();
</script>
