<script>
(function(){
  try{
    var hasTok=function(){ try{return !!(localStorage.getItem('sm_user_token')||sessionStorage.getItem('sm_user_token'));}catch(x){return false;} };
    if(!hasTok()) document.querySelectorAll('[data-account-link]').forEach(function(a){ a.href='auth.html?next='+encodeURIComponent('dashboard.html'); });
  }catch(e){}
  document.addEventListener('click',function(e){
    var a=e.target&&e.target.closest?e.target.closest('[data-account-link]'):null;
    if(!a) return;
    var t=''; try{t=localStorage.getItem('sm_user_token')||sessionStorage.getItem('sm_user_token')||'';}catch(x){}
    if(!t){ e.preventDefault(); location.href='auth.html?next='+encodeURIComponent('dashboard.html'); }
  });
})();
</script>

<script>
(function(){
  'use strict';
  var esc = function(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(m){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]; }); };
  var $ = function(id){ return document.getElementById(id); };
  function token(){ try{ return localStorage.getItem('sm_user_token')||sessionStorage.getItem('sm_user_token')||''; }catch(e){ return ''; } }
  function headers(){ var t=token(); return t ? { 'Authorization':'Bearer '+t } : {}; }
  function toast(msg){
    var t = document.createElement('div');
    t.className = 'fixed bottom-20 lg:bottom-6 left-1/2 -translate-x-1/2 bg-[#0F2043] text-white px-5 py-3 rounded-full text-[13px] font-semibold shadow-xl z-50';
    t.textContent = msg;
    document.body.appendChild(t);
    setTimeout(function(){ t.remove(); }, 2200);
  }
  var all = [];

  function coverHTML(b){
    if(b.cover) return '<img src="'+esc(b.cover)+'" alt="'+esc(b.title)+'" class="absolute inset-0 w-full h-full object-cover" loading="lazy">';
    var color = b.ebookBatchColor || b.batchColor || '#0EA5E9';
    return '<div class="absolute inset-0 flex items-center justify-center" style="background:linear-gradient(135deg,'+esc(color)+' 0%,#0F2043 100%)"><i class="fa-solid fa-book-open text-white/30 text-[26px]"></i></div>';
  }

  function render(){
    var box = $('meList'), cnt = $('meCount');
    var q = '';
    try{ q = ($('meSearch').value||'').toLowerCase().trim(); }catch(e){}
    var list = all.filter(function(b){
      if(!q) return true;
      return ((b.title||'')+' '+(b.author||'')).toLowerCase().indexOf(q) !== -1;
    });
    if(cnt) cnt.textContent = all.length ? all.length : '';
    if(!token()){
      box.innerHTML = '<div class="text-center py-12 px-4"><div class="w-14 h-14 rounded-full bg-[#EEF2FF] flex items-center justify-center mx-auto"><i class="fa-regular fa-user text-[#1A56FF] text-[20px]"></i></div>'
        + '<p class="text-[14px] font-bold text-[#0F2043] mt-4">Login to see your e-books</p>'
        + '<a href="auth.html?next='+encodeURIComponent('my-ebooks.html')+'" class="inline-flex items-center gap-1.5 mt-4 px-5 py-2.5 rounded-[10px] bg-[#1A56FF] text-white font-bold text-[12.5px]">Login <i class="fa-solid fa-arrow-right text-[11px]"></i></a></div>';
      return;
    }
    if(!list.length){
      box.innerHTML = '<div class="text-center py-12 px-4"><div class="w-14 h-14 rounded-full bg-[#EEF2FF] flex items-center justify-center mx-auto"><i class="fa-solid fa-book text-[#1A56FF] text-[20px]"></i></div>'
        + '<p class="text-[14px] font-bold text-[#0F2043] mt-4">'+(all.length ? 'Kono e-book mileni' : 'Akono kono e-book keno nai')+'</p>'
        + '<p class="text-[12px] text-slate-500 mt-1">Pochonder e-book kine ekhan theke download koro</p>'
        + '<a href="ebooks.html" class="inline-flex items-center gap-1.5 mt-4 px-5 py-2.5 rounded-[10px] bg-[#1A56FF] text-white font-bold text-[12.5px]">Browse E-Books <i class="fa-solid fa-arrow-right text-[11px]"></i></a></div>';
      return;
    }
    box.innerHTML = list.map(function(b){
      return '<div class="eb-card bg-white rounded-[14px] border border-slate-100 shadow-[0_2px_10px_rgba(0,0,0,0.04)] overflow-hidden flex">'
        + '<div class="w-[104px] sm:w-[128px] flex-shrink-0 relative overflow-hidden bg-[#F1F5F9]">'
        + coverHTML(b)
        + '<span class="absolute top-2 left-2 px-2 py-0.5 rounded-full bg-black/45 backdrop-blur border border-white/25 text-white text-[8px] font-semibold"><i class="fa-solid fa-file-pdf mr-0.5"></i>PDF</span>'
        + '</div>'
        + '<div class="flex-1 min-w-0 p-3 sm:p-4 flex flex-col">'
        + '<div class="flex items-center gap-1.5 flex-wrap mb-1">'
        + (b.ebookBatchName || b.batchName ? '<span class="px-1.5 py-0.5 rounded-full bg-[#E0F2FE] text-[#0284C7] text-[9px] font-bold">'+esc(b.ebookBatchName||b.batchName)+'</span>' : '')
        + '<span class="px-1.5 py-0.5 rounded-full bg-[#E6F4EA] text-[#16A34A] text-[9px] font-bold"><i class="fa-solid fa-check mr-0.5 text-[7px]"></i>Owned</span></div>'
        + '<h3 class="bangla font-bold text-[13px] sm:text-[14px] text-[#0F2043] leading-snug line-clamp-2">'+esc(b.title)+'</h3>'
        + '<p class="text-[11px] text-slate-500 mt-1 truncate">'+esc(b.author ? 'By '+b.author : (b.categoryName||''))+'</p>'
        + '<div class="mt-auto flex items-center gap-2 pt-3">'
        + '<button data-dl="'+b.id+'" class="flex-1 inline-flex items-center justify-center gap-1.5 py-2.5 rounded-[10px] bg-[#16A34A] hover:bg-[#15803D] text-white font-bold text-[12.5px]"><i class="fa-solid fa-download text-[12px]"></i> Download</button>'
        + '<a href="ebook.html?id='+b.id+'" class="w-10 h-10 rounded-[10px] border border-slate-200 flex items-center justify-center text-slate-500 hover:text-[#1A56FF] hover:border-[#1A56FF] flex-shrink-0" title="Details"><i class="fa-solid fa-circle-info text-[14px]"></i></a>'
        + '</div></div></div>';
    }).join('');
  }

  async function gatedDownload(id){
    toast('Download ready hocche...');
    try{
      var r = await fetch('/api/my/ebooks/' + encodeURIComponent(id) + '/download', { headers: headers() });
      var j = await r.json();
      if(!r.ok || !j.success) throw new Error((j && j.message) || 'Download failed');
      window.location.href = j.data.fileUrl;
    }catch(e){ toast(e.message); }
  }

  async function boot(){
    if(!token()){ render(); return; }
    var ownedIds = [], ebMap = {};
    try{
      var ro = await fetch('/api/public/my/orders',{headers:headers()});
      if(ro.ok){
        var jo = await ro.json();
        (jo.data||[]).forEach(function(o){
          if(!['confirmed','completed'].includes(String(o.status).toLowerCase())) return;
          (o.items||[]).forEach(function(it){
            var eid = it.ebookId != null ? String(it.ebookId) : '';
            if(eid && !ownedIds.includes(eid)) ownedIds.push(eid);
          });
        });
      }
    }catch(e){}
    if(ownedIds.length){
      try{
        var re = await fetch('/api/public/ebooks?limit=200');
        if(re.ok){ var je = await re.json(); (je.data||[]).forEach(function(b){ ebMap[String(b.id)] = b; }); }
      }catch(e){}
      all = ownedIds.map(function(id){ return ebMap[id] || { id: id, title: 'E-Book #'+id }; });
    }
    render();
  }

  document.addEventListener('click', function(e){
    var b = e.target.closest ? e.target.closest('[data-dl]') : null;
    if(b){ e.preventDefault(); gatedDownload(b.dataset.dl); }
  });
  document.getElementById('meSearch').addEventListener('input', render);
  document.querySelectorAll('[data-dash-logout]').forEach(function(b){ b.addEventListener('click', async function(){
    try{ await fetch('/api/public/auth/logout',{method:'POST',headers:headers()}); }catch(e){}
    try{ localStorage.removeItem('sm_user_token'); sessionStorage.removeItem('sm_user_token'); }catch(e){}
    location.href = 'index.html';
  }); });
  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',boot);
  else boot();
})();
</script>
